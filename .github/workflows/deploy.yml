# builds the site and publishes it to GitHub Pages on every push to main
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets me re-run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# don't let two deploys fight each other
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci # postinstall regenerates src/data/*.json from warframe-items
      - run: npm run check # don't deploy if the damage math broke
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
